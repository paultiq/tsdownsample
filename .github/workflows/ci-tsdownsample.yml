name: CI tsdownsample

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - '**'

defaults:
  run:
    shell: bash

jobs:

  Lint_and_Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, rustfmt
      - name: Setup Rust
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
      - name: Cache rust
        uses: Swatinem/rust-cache@v2

      - run: pip install -r tests/requirements-linting.txt
      - run: pip freeze
      - run: make lint  # Lint Python & Rust
      - run: make mypy  # Type check Python

  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        rust: ['nightly']  # ['stable', 'beta']
        python-version: ['3.12', '3.14t']
    
    env:
      PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r tests/requirements.txt

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, rustfmt
      - name: Setup Rust
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
      - name: Cache rust
        uses: Swatinem/rust-cache@v2

      - name: install develop version
        run: make install
        
      - run: pip install -r tests/requirements.txt

      - run: pip freeze

      - run: make test  # Test Python

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

  Build:
    name: build ${{ matrix.build-type }} on ${{ matrix.os }} (${{ matrix.target }})
    # if: "success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'Full Build'))"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        target: [x86_64, aarch64]
        build-type: ['cp310', 'cp311', 'abi3-py312']
        include:
          - os: windows
            ls: dir
        exclude:
          - os: windows
            target: aarch64

    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v3

    - name: set up python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.build-type == 'cp310' && '3.10' || matrix.build-type == 'cp311' && '3.11' || '3.12' }}
        architecture: ${{ matrix.python-architecture || 'x64' }}

    - name: build sdist
      if: ${{ matrix.os == 'ubuntu' && matrix.target == 'x86_64' && matrix.build-type == 'abi3-py312' }}
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: build wheels (version-specific)
      if: ${{ matrix.build-type == 'cp310' || matrix.build-type == 'cp311' }}
      uses: PyO3/maturin-action@v1
      with:
        rust-toolchain: nightly
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist --interpreter ${{ matrix.build-type == 'cp310' && '3.10' || '3.11' }}

    - name: build wheels (abi3-py312)
      if: ${{ matrix.build-type == 'abi3-py312' }}
      uses: PyO3/maturin-action@v1
      with:
        rust-toolchain: nightly
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist --features abi3-py312

    - run: ${{ matrix.ls || 'ls -lh' }} dist/

    - uses: actions/upload-artifact@v4
      with:
        name: pypi_files-${{ matrix.build-type }}-${{ matrix.os }}-${{ matrix.target }}
        path: dist

  Build_FreeThreaded:
    name: build free-threaded on ${{ matrix.os }} (${{ matrix.target }})
    # if: "success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'Full Build'))"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        target: [x86_64, aarch64]
        include:
          - os: windows
            ls: dir
          - os: macos
            target: aarch64
        exclude:
          - os: windows
            target: aarch64

    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v3

    - name: set up python 3.14t
      uses: actions/setup-python@v6
      with:
        python-version: '3.14t'
        architecture: ${{ matrix.python-architecture || 'x64' }}

    - name: build free-threaded wheels
      uses: PyO3/maturin-action@v1
      with:
        rust-toolchain: nightly
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist --interpreter 3.14t
      env:
        UNSAFE_PYO3_BUILD_FREE_THREADED: 1

    - run: ${{ matrix.ls || 'ls -lh' }} dist/

    - uses: actions/upload-artifact@v4
      with:
        name: pypi_files-ft-${{ matrix.os }}-${{ matrix.target }}
        path: dist

  Release:
    needs: [Lint_and_Check, Test, Build]
    # if: "success() && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: set up python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - run: pip install -U twine packaging

    - name: get dist artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: pypi_files-*
        merge-multiple: true
        path: dist

    - run: twine check dist/*

    - name: upload to pypi
      run: twine upload dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.pypi_token }}

# https://github.com/samuelcolvin/rtoml/blob/main/.github/workflows/ci.yml
# https://github.com/messense/rjmespath-py/blob/main/.github/workflows/CI.yml
