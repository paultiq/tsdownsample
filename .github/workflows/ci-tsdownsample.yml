name: CI tsdownsample

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - '**'

defaults:
  run:
    shell: bash

jobs:

  Lint_and_Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, rustfmt
      - name: Setup Rust
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
      - name: Cache rust
        uses: Swatinem/rust-cache@v2

      - run: pip install -r tests/requirements-linting.txt
      - run: pip freeze
      - run: make lint  # Lint Python & Rust
      - run: make mypy  # Type check Python

  Build:
    name: build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner || format('{0}-latest', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        target: [x86_64, aarch64]
        include:
          - os: windows
            ls: dir
          - os: macos
            target: aarch64
            runner: macos-latest
            python-architecture: arm64
          - os: macos
            target: x86_64
            runner: macos-latest
            python-architecture: x64
        exclude:
          - os: windows
            target: aarch64

    steps:
    - uses: actions/checkout@v6

    - name: set up python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        architecture: ${{ matrix.python-architecture || 'x64' }}

    - name: build sdist
      if: ${{ matrix.os == 'ubuntu' && matrix.target == 'x86_64' }}
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: build wheels (abi3)
      uses: PyO3/maturin-action@v1
      with:
        rust-toolchain: nightly
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist --features abi3-py310

    - run: ${{ matrix.ls || 'ls -lh' }} dist/

    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}-${{ matrix.target }}
        path: dist
        retention-days: 1

  Test:
    name: test ${{ matrix.os }} (${{ matrix.target }}) py${{ matrix.python-version }}
    needs: Build
    runs-on: ${{ matrix.runner || format('{0}-latest', matrix.os) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows, macos]
        target: [x86_64, aarch64]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos
            target: aarch64
            runner: macos-latest
          - os: macos
            target: x86_64
            runner: macos-15-intel
        exclude:
          - os: windows
            target: aarch64
          # Only test native builds (skip cross-compilation)
          - os: ubuntu
            target: aarch64

    env:
      PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.target }}
          path: dist

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Install built wheel
        run: pip install dist/*.whl

      - run: pip freeze

      - run: make test  # Test Python

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

  Release:
    needs: [Lint_and_Check, Test]
    # if: "success() && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: set up python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - run: pip install -U twine packaging

    - name: get dist artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: dist-*
        merge-multiple: true
        path: dist

    - run: twine check dist/*

    - name: upload to pypi
      run: twine upload dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.pypi_token }}

# https://github.com/samuelcolvin/rtoml/blob/main/.github/workflows/ci.yml
# https://github.com/messense/rjmespath-py/blob/main/.github/workflows/CI.yml
