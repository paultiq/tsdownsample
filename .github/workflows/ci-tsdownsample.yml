name: CI tsdownsample

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - '**'

defaults:
  run:
    shell: bash

jobs:

  Lint_and_Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, rustfmt
      - name: Setup Rust
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
      - name: Cache rust
        uses: Swatinem/rust-cache@v2

      - run: pip install -r tests/requirements-linting.txt
      - run: pip freeze
      - run: make lint  # Lint Python & Rust
      - run: make mypy  # Type check Python

  Test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'macOS-latest', 'ubuntu-latest']
        rust: ['nightly']  # ['stable', 'beta']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    
    env:
      PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r tests/requirements.txt

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: nightly
          components: clippy, rustfmt
      - name: Setup Rust
        run: |
          rustup update nightly --no-self-update
          rustup default nightly
      - name: Cache rust
        uses: Swatinem/rust-cache@v2

      - name: install develop version
        run: make install
        
      - run: pip install -r tests/requirements.txt

      - run: pip freeze

      - run: make test  # Test Python

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5

  Build:
    name: build abi3-py310 on ${{ matrix.os }} (${{ matrix.target }})
    # if: "success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'Full Build'))"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            target: x86_64
          - os: ubuntu
            target: aarch64
          - os: windows
            target: x86_64
            ls: dir
          - os: macos
            target: aarch64

    runs-on: ${{ format('{0}-latest', matrix.os) }}
    steps:
    - uses: actions/checkout@v6

    - name: set up python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
        architecture: ${{ matrix.python-architecture || 'x64' }}

    - name: build sdist
      if: ${{ matrix.os == 'ubuntu' && matrix.target == 'x86_64' }}
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist

    - name: build wheels (abi3-py310)
      uses: PyO3/maturin-action@v1
      with:
        rust-toolchain: nightly
        target: ${{ matrix.target }}
        manylinux: auto
        args: --release --out dist --features abi3-py310

    - run: ${{ matrix.ls || 'ls -lh' }} dist/

    - uses: actions/upload-artifact@v4
      with:
        name: pypi_files-abi3-${{ matrix.os }}-${{ matrix.target }}
        path: dist

  Release:
    needs: [Lint_and_Check, Test, Build]
    # if: "success() && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: set up python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - run: pip install -U twine packaging

    - name: get dist artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: pypi_files-*
        merge-multiple: true
        path: dist

    - run: twine check dist/*

    - name: upload to pypi
      run: twine upload dist/*
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.pypi_token }}

# https://github.com/samuelcolvin/rtoml/blob/main/.github/workflows/ci.yml
# https://github.com/messense/rjmespath-py/blob/main/.github/workflows/CI.yml
